<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" role="img" aria-label="BONAL logotip">
  <!--
    SVG recreation of the BONAL puzzle logo.
    Original: logo.png / logo and name.bmp (PNG, 282x62 px).
    Four interlocking puzzle pieces; connectors verified to share boundary curves.
    Piece positions (viewBox 0 0 110 110, 5px outer padding):
      TL: top-left cell (5–55, 5–55)  — right tab + bottom tab
      TR: top-right cell (55–105, 5–55) — left socket + bottom tab
      BL: bottom-left cell (5–55, 55–105) — top socket + right tab
      BR: bottom-right cell (55–105, 55–105) — top socket + left socket
    Tab geometry: edge at midpoint ±16 units, control points offset 12 px outward.
  -->

  <!-- TL — orange, right tab + bottom tab -->
  <path fill="#D97030" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"
        d="M5,5 L55,5 L55,22 C67,22 67,38 55,38 L55,55 L38,55 C38,67 22,67 22,55 L5,55 Z"/>

  <!-- TR — teal, left socket + bottom tab -->
  <path fill="#38AFA2" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"
        d="M55,5 L105,5 L105,55 L88,55 C88,67 72,67 72,55 L55,55 L55,38 C67,38 67,22 55,22 Z"/>

  <!-- BL — blue, top socket + right tab -->
  <path fill="#4090C8" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"
        d="M5,55 L22,55 C22,67 38,67 38,55 L55,55 L55,72 C67,72 67,88 55,88 L55,105 L5,105 Z"/>

  <!-- BR — lime green, top socket + left socket -->
  <path fill="#A8BA24" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"
        d="M55,55 L72,55 C72,67 88,67 88,55 L105,55 L105,105 L55,105 L55,88 C67,88 67,72 55,72 Z"/>
</svg>
